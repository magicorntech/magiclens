appId: com.magiclens.app
productName: MagicLens
copyright: Copyright (c) MagicLens Magicorn contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  # The main process loads resources/icon.png at runtime via `join(__dirname, '../../resources')`
  # — the tray icon, the dock icon, both window icons and notification icons all resolve there.
  # Left out of the package that path simply doesn't exist, and the menu-bar tray in particular
  # fails silently: an unreadable path yields an empty NativeImage, which macOS renders as an
  # invisible status item, so the widget looks like it never launched.
  - resources/**
  - '!**/*.map'
  - '!**/*.ts'

asarUnpack:
  - '**/node_modules/node-pty/**'

# electron-updater reads this at runtime to know where to look for new releases.
#
# releaseType is "draft", not "release": the three platform builds run in parallel and macOS
# (slower, due to notarization) finishes well after Windows/Linux. If each platform published
# straight to a public release, there'd be a multi-minute window where the release exists with
# some platforms' latest*.yml missing — any client checking for updates in that window gets a 404
# on its own platform's file. Publishing as a draft keeps the release invisible to electron-updater
# and the public API until every platform has uploaded; the "Generate changelog & finalize
# release" job in release.yml flips it to published (`gh release edit --draft=false`) only after
# all three builds succeed.
publish:
  provider: github
  owner: magicorntech
  repo: magiclens
  releaseType: draft

# Auto-update on macOS requires the app (and the downloaded update) to be code-signed.
# Set CSC_LINK / CSC_KEY_PASSWORD env vars in CI to enable signing + notarization.
# Without those, afterSign.js falls back to a free ad-hoc signature so the app can still
# launch on Apple Silicon (which refuses to run completely unsigned binaries).
afterSign: build/afterSign.js

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  # MagicLens has no multi-window state to restore, so macOS's "Resume" window-restoration
  # bookkeeping is pure downside for us: it's what produces the "The last time you opened
  # MagicLens, it was force quit while reopening windows" prompt some users (mostly on Apple
  # Silicon) hit on the next launch after any abnormal termination. Turning it off entirely
  # means an abnormal quit is just a normal relaunch with no dialog.
  extendInfo:
    NSQuitAlwaysKeepsWindows: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  writeUpdateInfo: true

win:
  icon: build/icon.png
  # NSIS produces a single installer .exe; add "msi" here too if a WiX toolchain is available in CI.
  # Authenticode signing is WIN_CSC_LINK-only. CSC_LINK is the macOS Developer ID p12 and must
  # never be present on the Windows CI job — Windows cannot trust Apple's CA, and
  # electron-updater then rejects the update as "not signed by the application owner".
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

npmRebuild: false
