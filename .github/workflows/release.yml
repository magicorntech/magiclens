name: Release

# Triggered whenever a semantic version tag (v1.0.0, v1.0.1, v1.1.0, v2.0.0, ...) is pushed.
# Builds desktop installers for macOS (dmg, arm64 + x64), Windows (nsis exe) and Linux
# (AppImage + deb), uploads them all to a single GitHub Release for the tag, and writes an
# auto-generated changelog into the release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Update package.json before tagging."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main bundles
        run: npm run build

      # Code signing secrets are platform-scoped on purpose. electron-builder's generic
      # CSC_LINK is used for *every* platform when set, so exporting the Apple Developer ID
      # p12 on the Windows job Authenticode-signs MagicLens-Setup-*.exe with
      # "Developer ID Application: …". Windows cannot build a trust chain for Apple's CA,
      # and electron-updater then rejects the file:
      #   "New version X is not signed by the application owner"
      # with StatusMessage "The certificate chain could not be built to a trusted root".
      # electron-builder also treats an *empty string* CSC_LINK/WIN_CSC_LINK as a missing
      # file path and hard-fails, so we only export a var when the secret is actually set.
      - name: Export macOS code signing secrets
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.MAC_CSC_KEY_PASSWORD }}" ]; then echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]; then echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"; fi

      - name: Export Windows code signing secrets
        if: matrix.platform == 'win'
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then echo "WIN_CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"; fi
          if [ -n "${{ secrets.WIN_CSC_KEY_PASSWORD }}" ]; then echo "WIN_CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"; fi
          # Refuse to run if a leftover Apple CSC_LINK leaked into this job. Signing the
          # NSIS installer with it ships a Windows update that every client will reject.
          if [ -n "${CSC_LINK}" ] && [ -z "${WIN_CSC_LINK}" ]; then
            echo "::error::CSC_LINK is set on the Windows job without WIN_CSC_LINK. Unset it — that is the macOS Developer ID certificate, not a Windows Authenticode cert."
            exit 1
          fi

      - name: Build & publish desktop artifacts
        run: npx electron-builder --publish always --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    name: Generate changelog & finalize release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog from git history
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-creatordate | grep -A1 "^${CURRENT_TAG}$" | tail -n1)"
          if [ "$PREV_TAG" == "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
            echo "No previous tag found, using full history up to $CURRENT_TAG"
          else
            RANGE="$PREV_TAG..$CURRENT_TAG"
            echo "Changelog range: $RANGE"
          fi

          {
            echo "## What's changed"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:"- %s (%h)"
            echo ""
            echo ""
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Update GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MagicLens ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG_RELEASE.md \
            --draft=false \
            --latest
