name: Release

# One pipeline per version tag: lint and tests, then macOS and Windows installers.
# A failed test job skips the builds.
# Triggered whenever a semantic version tag (v1.0.0, v1.0.1, v1.1.0, v2.0.0, ...) is pushed.
# macOS produces a dmg to download and a zip for the auto-updater. Windows produces an nsis exe.
# uploads them to a single GitHub Release for the tag, and writes the curated
# What's New notes (no commit hashes or compare links).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Update package.json before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint shared code
        run: npm run lint

      - name: Unit and page tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main bundles
        run: npm run build

      # macOS: do not hand CSC_LINK to electron-builder. electron-builder 25 creates a
      # temporary keychain with a random password, then calls
      #   security set-key-partition-list -k <p12 password>
      # instead of the keychain password (electron-userland/electron-builder#10066). That
      # used to slip through on older runners; macOS 26 rejects it with
      #   SecKeychainUnlock: The user name or passphrase you entered is not correct.
      # Import the Developer ID ourselves, then let electron-builder auto-discover it.
      # Never export CSC_LINK on Windows: electron-builder would Authenticode-sign the
      # NSIS installer with "Developer ID Application: …", which Windows cannot trust.
      - name: Import Developer ID certificate
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "MAC_CSC_LINK is not set; macOS artifacts will be ad-hoc signed."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/magiclens.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CSC_LINK, "base64"))' "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          echo "MAC_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          {
            echo "MAC_KEYCHAIN_PASSWORD<<EOF"
            echo "$KEYCHAIN_PASSWORD"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Imported Developer ID; identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build & publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
          fi
          if [ -n "${MAC_KEYCHAIN_PATH:-}" ]; then
            security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$MAC_KEYCHAIN_PATH"
          fi
          npx electron-builder --publish always --mac

      - name: Build & publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            echo "::error::CSC_LINK is set on the Windows job. Unset it — that is the macOS Developer ID certificate, not a Windows Authenticode cert."
            exit 1
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder --publish always --win

  changelog:
    name: Generate changelog & finalize release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        id: changelog
        run: |
          if node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > CHANGELOG_RELEASE.md; then
            echo "Using What's New notes for ${GITHUB_REF_NAME}"
          else
            echo "No What's New entry; listing commit subjects only"
            CURRENT_TAG="${GITHUB_REF_NAME}"
            PREV_TAG="$(git tag --sort=-creatordate | grep -A1 "^${CURRENT_TAG}$" | tail -n1)"
            if [ "$PREV_TAG" == "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
              RANGE="$CURRENT_TAG"
            else
              RANGE="$PREV_TAG..$CURRENT_TAG"
            fi
            {
              echo "## What's changed"
              echo ""
              git log "$RANGE" --no-merges --pretty=format:"- %s"
              echo ""
            } > CHANGELOG_RELEASE.md
          fi
          cat CHANGELOG_RELEASE.md

      - name: Update GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MagicLens ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG_RELEASE.md \
            --draft=false \
            --latest
