name: Release

# Triggered whenever a semantic version tag (v1.0.0, v1.0.1, v1.1.0, v2.0.0, ...) is pushed.
# Builds desktop installers for macOS (dmg + the zip the updater needs, arm64 + x64), Windows (nsis exe)
# and Linux (AppImage + deb).
#
# This repository holds the source and stays private. Installers are published to the public,
# releases-only repository (RELEASES_REPO) with RELEASES_TOKEN — a fine-grained token that has
# Contents: read/write on that repository only. The notes come from src/shared/whatsNew.ts, never from
# commit subjects.
#
# Bridge: apps older than the move still look for updates in THIS repository. While the repository
# variable LEGACY_MIRROR is 'true', each release is also copied here so those apps can reach the first
# build that knows the new location. Turn the variable off and make this repository private afterwards.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASES_REPO: magicorntech/magiclens-releases

jobs:
  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. Update package.json before tagging."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main bundles
        run: npm run build

      # macOS: do not hand CSC_LINK to electron-builder. electron-builder 25 creates a
      # temporary keychain with a random password, then calls
      #   security set-key-partition-list -k <p12 password>
      # instead of the keychain password (electron-userland/electron-builder#10066). That
      # used to slip through on older runners; macOS 26 rejects it with
      #   SecKeychainUnlock: The user name or passphrase you entered is not correct.
      # Import the Developer ID ourselves, then let electron-builder auto-discover it.
      # Never export CSC_LINK on Windows: electron-builder would Authenticode-sign the
      # NSIS installer with "Developer ID Application: …", which Windows cannot trust.
      - name: Import Developer ID certificate
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "MAC_CSC_LINK is not set; macOS artifacts will be ad-hoc signed."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/magiclens.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CSC_LINK, "base64"))' "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          echo "MAC_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          {
            echo "MAC_KEYCHAIN_PASSWORD<<EOF"
            echo "$KEYCHAIN_PASSWORD"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Imported Developer ID; identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build & publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
          fi
          if [ -n "${MAC_KEYCHAIN_PATH:-}" ]; then
            security unlock-keychain -p "$MAC_KEYCHAIN_PASSWORD" "$MAC_KEYCHAIN_PATH"
          fi
          npx electron-builder --publish always --mac

      - name: Build & publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            echo "::error::CSC_LINK is set on the Windows job. Unset it — that is the macOS Developer ID certificate, not a Windows Authenticode cert."
            exit 1
          fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder --publish always --win

      - name: Build & publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --publish always --linux

  publish-notes:
    name: Publish release notes
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (typescript, for the notes script)
        run: npm ci --ignore-scripts

      - name: Build release notes from whatsNew.ts
        run: node scripts/release-notes.mjs "${{ needs.verify-version.outputs.version }}" > RELEASE_NOTES.md

      - name: Publish the release in the releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "$RELEASES_REPO" \
            --title "MagicLens ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false \
            --latest

      - name: Keep the notes for the legacy mirror
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  legacy-mirror:
    name: Copy release to this repository (bridge for older apps)
    needs: [publish-notes]
    if: ${{ vars.LEGACY_MIRROR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Mirror assets
        env:
          SRC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          GH_TOKEN="$SRC_TOKEN" gh release download "${GITHUB_REF_NAME}" --repo "$RELEASES_REPO" --dir assets
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MagicLens ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
