name: CI

# Pull requests and master only. A release tag runs tests inside Release,
# then the installers, so a version push is one pipeline.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Lint and unit/page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint shared code
        run: npm run lint

      - name: Unit and page tests
        run: npm test
