name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'release/**'

jobs:
  test:
    name: Lint and unit/page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint shared code
        run: npm run lint

      - name: Unit and page tests
        run: npm test
