name: Refresh release notes

# Rewrites an already published release body from src/shared/whatsNew.ts.
# No commit hashes and no compare URL.
# Manual only. The Release workflow already writes these notes after the
# installers upload, so a version push stays a single pipeline.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update. Empty uses package.json.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write notes
        run: node scripts/release-notes.mjs "${{ steps.tag.outputs.tag }}" > CHANGELOG_RELEASE.md

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG is not published yet. The Release workflow writes these notes after the installers upload."
            exit 0
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file CHANGELOG_RELEASE.md
